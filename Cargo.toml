[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"

[workspace.lints.rust]
# none of the code needs unsafe; this keeps it that way
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
mh3u-app = { path = "crates/mh3u-app" }
mh3u-core = { path = "crates/mh3u-core" }
flate2 = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
