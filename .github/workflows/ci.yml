name: CI

on:
  push:
    branches: [main]
  pull_request:

# nothing here needs more than to read the repository
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to the commit of the release named in the comment (Dependabot keeps them current), so that a moved tag cannot change
# what runs here.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # the tests that need the game dump or a personal save skip themselves when those are missing
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: '! cargo tree -p mh3u-app | grep -E "ratatui|crossterm"'

  audit:
    # known vulnerabilities in the crates we depend on (https://rustsec.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
